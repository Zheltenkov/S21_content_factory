# Критерии судьи (слой 2 измерения готовых проектов).
#
# Признаки переписаны из источников дословно: чек-лист правил — без изменений (к названию раздела добавлена точка
# после буквы; в названии раздела В запятой нет и в источнике). В рубриках паспорта название признака и его описание соединены двоеточием, строки описания — точкой с
# запятой; исправлены четыре опечатки («предусмотреан», «поддрерживающие», «соотвествует», «подходящем»); опущены
# ссылки на примеры и образец текста анкеты обратной связи.
# Свои здесь только служебные поля: кто может подтвердить признак (by), какие сведения сверх самого проекта для
# этого нужны (needs), какая часть признака оценивается, если не весь (scope), на каком этапе признак проверяется
# (stages), в какую группу запроса он входит (group), чем подтверждается оценка (evidence), почему оценка не входит в
# итог (uncounted): такой признак судье задаётся как все, оценка показана в отчёте, но в сумму и в процент не идёт.
#
# Версию менять при любой правке текста признака, состава или служебных полей: отчёт пишет версию, и оценки разных
# версий не сравниваются.
# 0.2 (06.10.2026): P23 и P26 вне итога. Текст признаков и запрос судье не менялись: ответ, полученный на тот же
# запрос при версии 0.1, остаётся ответом на него — меняется только то, что из оценок складывается в итог.
version: "0.2"
date: "2026-10-06"
status: >-
  Версия 0: чек-лист правил автор пометил как сгенерированный и не вычитанный; пороги 85 и 70 процентов — стартовая
  гипотеза (так сказано в правилах). Распределение по этапам и группам — чтение таблицы «Как применять правила на
  разных этапах», методологом не подтверждено.

# Откуда взят признак. Итог считается по каждому источнику отдельно: у каждого своя шкала и свой знаменатель.
# scale — баллы 0, 1, 2 словами источника; судье показываются обе шкалы, каждая к своим критериям.
sources:
  rules:
    title: «Формализованные правила хорошего образовательного контента», диагностический чек-лист
    short: Правила (R)
    received: "2026-10-05"
    formula: сумма баллов / (2 × число применимых пунктов) × 100
    scale:
      "0": признак не выполнен или обнаружено существенное противоречие
      "1": выполнено частично, требуется локальная доработка
      "2": выполнено в достаточной степени для текущей версии
  passport_project:
    title: Паспорт программы, вкладка «Критерии качества проекта»
    short: Паспорт, проект (P)
    received: "2026-10-05"
    formula: "в источнике: сумма баллов / 32 × 100 — знаменатель записан числом и не равен 2 × 27 строк; здесь считается как у правил — сумма баллов / (2 × число пунктов с оценкой) × 100"
    scale:
      "0": совсем не соответствует критерию
      "1": соответствует критерию, но нужно доработать
      "2": идеально соответствует критерию
  passport_checklist:
    title: Паспорт программы, вкладка «Критерии качества чек-листа проекта»
    short: Паспорт, чек-лист (C)
    received: "2026-10-05"
    formula: "в источнике: сумма баллов / 24 × 100 — знаменатель записан числом и не равен 2 × 13 строк; здесь считается как у правил — сумма баллов / (2 × число пунктов с оценкой) × 100"
    scale:
      "0": совсем не соответствует критерию
      "1": соответствует критерию, но нужно доработать
      "2": идеально соответствует критерию

# Состояния сверх баллов. «Неприменимо» есть только в шкале правил; к рубрикам паспорта оно добавлено здесь, как и
# «нет данных» — состояние из правил («не хватает данных»). В балл оба не входят, успехом не считаются.
scale:
  "0": балл источника
  "1": балл источника
  "2": балл источника
  na: неприменимо; не входит в максимально возможный балл и требует короткого пояснения
  no_data: в показанных материалах не хватает сведений, чтобы оценить

# Группа — один запрос к судье. shows — что из проекта он при этом видит:
# readme — README целиком; materials — текстовые материалы, названные в README; checklist — вопросы чек-листа;
# files — перечень файлов проекта. Сведения, посчитанные кодом, показываются всегда.
groups:
  logic:
    title: Учебная логика, аудитория, структура
    shows: [readme, materials]
  tasks:
    title: Задания и язык
    shows: [readme, materials]
  values:
    title: Ценности «Школы 21»
    shows: [readme]
  checking:
    title: Проверка и чек-лист
    shows: [readme, checklist]
  package:
    title: Оформление и комплект
    shows: [readme, files]

# by: judge — оценивает модель по тексту; run — нужен запуск или открытие ссылок; expert — нужен предметный эксперт
#     (правило 8: «правдоподобный текст модели не является подтверждением технической корректности»).
# evidence: чем подтверждается оценка. presence (по умолчанию) — признак состоит в том, что в проекте что-то есть:
#     оценки 1 и 2 требуют цитату (где это есть), 0 — нет (цитировать нечего). absence — признак состоит в том, что
#     чего-то нет («нет заглушек») или что нечто верно для каждого («каждый критерий наблюдаем», «термины используются
#     последовательно»): показать текстом можно только нарушение, поэтому цитату требуют оценки 0 и 1, а 2 — нет.
#     Оценка без требуемой цитаты в итог не входит. Отнесение признака к одному из двух видов — чтение его
#     формулировки, методологом не подтверждено.
# needs: сведения, которых в самом проекте нет. Без них признак получает «нет данных» от кода, модель не спрашивается.
#     outcomes — утверждённые ОР проекта; hours — трудоёмкость и продолжительность из УП;
#     approved_files — утверждённый перечень материалов; standard_texts — стандартные введение и инструкция чек-листа;
#     track — основа или коммерция.
criteria:
  # ─── Правила: диагностический чек-лист ───────────────────────────────────────────────────────────────────────
  - {id: R01, source: rules, section: А. Образовательная логика, by: judge, needs: [outcomes], group: logic, stages: [concept, content],
     text: "Образовательный результат сформулирован как наблюдаемое изменение или действие слушателя."}
  - {id: R02, source: rules, section: А. Образовательная логика, by: judge, needs: [outcomes], group: logic, stages: [concept, content],
     text: "Каждое обязательное задание связано с ОР или необходимым промежуточным результатом."}
  - {id: R03, source: rules, section: А. Образовательная логика, by: judge, needs: [outcomes], group: logic, stages: [concept, content],
     text: "Итоговый продукт или демонстрация позволяют увидеть достижение ОР."}
  - {id: R04, source: rules, section: А. Образовательная логика, by: judge, group: logic, stages: [concept, content],
     text: "Бонусные задания не содержат обязательный путь к основному ОР.", evidence: absence,
     scope: "Оценивается, можно ли выполнить основную часть, не делая бонусных заданий. Утверждённых ОР у судьи нет."}

  - {id: R05, source: rules, section: Б. Аудитория и объём, by: judge, group: logic, stages: [concept, content],
     text: "Входной уровень и пререквизиты явно заданы."}
  - {id: R06, source: rules, section: Б. Аудитория и объём, by: judge, group: logic, stages: [content],
     text: "Новые термины и инструменты вводятся до момента использования.", evidence: absence}
  - {id: R07, source: rules, section: Б. Аудитория и объём, by: judge, needs: [hours], group: logic, stages: [concept, content],
     text: "Трудоёмкость учитывает чтение, настройку, ошибки и повторные попытки."}
  - {id: R08, source: rules, section: Б. Аудитория и объём, by: judge, needs: [hours], group: logic, stages: [concept, content],
     text: "Объём соответствует подтверждённой продолжительности программы."}

  - {id: R09, source: rules, section: В. Структура связность и сложность, by: judge, group: logic, stages: [concept, content],
     text: "Порядок заданий содержательно объясним."}
  - {id: R10, source: rules, section: В. Структура связность и сложность, by: judge, group: logic, stages: [concept, content],
     text: "Результаты предыдущих заданий используются дальше или переход явно обоснован."}
  - {id: R11, source: rules, section: В. Структура связность и сложность, by: judge, group: logic, stages: [concept, content],
     text: "Сложность растёт за счёт самостоятельности и новых решений."}
  - {id: R12, source: rules, section: В. Структура связность и сложность, by: judge, group: logic, stages: [concept, content],
     text: "У слушателя есть достаточная опора перед сложным самостоятельным действием."}
  - {id: R13, source: rules, section: В. Структура связность и сложность, by: judge, group: logic, stages: [content],
     text: "Сторителлинг и хуки помогают работе, а не маскируют разрывы логики.",
     note: "Проекту без сюжета ставится «неприменимо»: сюжет необязателен (комментарий к правилу 5). В правилах это оговорено согласием методолога; методологом пока не подтверждено."}

  - {id: R14, source: rules, section: Г. Качество заданий, by: judge, group: tasks, stages: [concept, content],
     text: "У задания понятны цель и практический контекст."}
  - {id: R15, source: rules, section: Г. Качество заданий, by: judge, group: tasks, stages: [content],
     text: "Ясно, что именно нужно сделать и что сдать."}
  - {id: R16, source: rules, section: Г. Качество заданий, by: judge, group: tasks, stages: [content],
     text: "Указаны входные данные, материалы, ограничения и формат результата."}
  - {id: R17, source: rules, section: Г. Качество заданий, by: judge, group: tasks, stages: [content],
     text: "Задание требует осмысленного действия, а не только копирования примера."}
  - {id: R18, source: rules, section: Г. Качество заданий, by: judge, group: checking, stages: [content],
     text: "Условия не содержат скрытых требований.", evidence: absence}
  - {id: R19, source: rules, section: Г. Качество заданий, by: judge, group: tasks, stages: [concept, content],
     text: "Обязательная и бонусная части разделены однозначно."}

  - {id: R20, source: rules, section: Д. Предметная корректность, by: expert, group: tasks, stages: [content],
     text: "Факты, термины, команды и примеры корректны."}
  - {id: R21, source: rules, section: Д. Предметная корректность, by: run, group: tasks, stages: [content],
     text: "Решение воспроизводится в заявленном окружении."}
  - {id: R22, source: rules, section: Д. Предметная корректность, by: judge, group: tasks, stages: [content],
     text: "Версии инструментов и существенные ограничения указаны."}
  - {id: R23, source: rules, section: Д. Предметная корректность, by: judge, group: checking, stages: [content],
     text: "Допустимые альтернативные решения не отклоняются без причины.", evidence: absence}
  - {id: R24, source: rules, section: Д. Предметная корректность, by: expert, group: tasks, stages: [content],
     text: "Нет выдуманных источников, функций, интерфейсов или ссылок."}

  - {id: R25, source: rules, section: Е. Проверка и обратная связь, by: judge, group: checking, stages: [concept, content],
     text: "Каждый критерий проверяет наблюдаемый признак.", evidence: absence}
  - {id: R26, source: rules, section: Е. Проверка и обратная связь, by: judge, group: checking, stages: [concept, content],
     text: "Все существенные критерии заранее видны в задании.", evidence: absence}
  - {id: R27, source: rules, section: Е. Проверка и обратная связь, by: judge, group: checking, stages: [concept, content],
     text: "Каждый обязательный результат задания отражён в проверке.", evidence: absence}
  - {id: R28, source: rules, section: Е. Проверка и обратная связь, by: judge, group: checking, stages: [content],
     text: "Один пункт чек-листа не объединяет несколько независимых требований.", evidence: absence}
  - {id: R29, source: rules, section: Е. Проверка и обратная связь, by: judge, group: checking, stages: [content],
     text: "Разные проверяющие с высокой вероятностью примут сопоставимое решение.", evidence: absence}
  - {id: R30, source: rules, section: Е. Проверка и обратная связь, by: judge, group: checking, stages: [content],
     text: "Для P2P-проверки достаточно данных без обращения к автору задания.", evidence: absence}

  - {id: R31, source: rules, section: Ж. Файлы и техническая целостность, by: judge, group: package, stages: [content],
     text: "Все обязательные файлы присутствуют и доступны.", evidence: absence,
     scope: "Оценивается по перечню файлов и сведениям кода: есть ли в проекте файлы, которые README называет выданными. Открывается ли файл, судья не проверяет."}
  - {id: R32, source: rules, section: Ж. Файлы и техническая целостность, by: judge, group: package, stages: [content],
     text: "Названия и пути совпадают с инструкциями.", evidence: absence}
  - {id: R33, source: rules, section: Ж. Файлы и техническая целостность, by: run, group: package, stages: [content],
     text: "Файлы открываются и запускаются в заявленном окружении."}
  - {id: R34, source: rules, section: Ж. Файлы и техническая целостность, by: judge, group: tasks, stages: [content],
     text: "Есть понятная инструкция запуска или использования."}
  - {id: R35, source: rules, section: Ж. Файлы и техническая целостность, by: judge, group: package, stages: [content],
     text: "Нет лишних, дублирующих, временных или секретных файлов.", evidence: absence,
     scope: "Оценивается по именам файлов в перечне; содержимое файлов судья не видит."}

  - {id: R36, source: rules, section: З. Язык и комплектность, by: judge, group: tasks, stages: [content],
     text: "Термины используются последовательно.", evidence: absence}
  - {id: R37, source: rules, section: З. Язык и комплектность, by: judge, group: tasks, stages: [content],
     text: "Текст можно выполнить без устных пояснений автора.", evidence: absence}
  - {id: R38, source: rules, section: З. Язык и комплектность, by: judge, group: tasks, stages: [content],
     text: "Нет заглушек, внутренних промптов и следов незавершённой генерации.", evidence: absence}
  - {id: R39, source: rules, section: З. Язык и комплектность, by: judge, group: package, stages: [content],
     text: "Ссылки работают, а критически важная информация не существует только во внешнем источнике.", evidence: absence,
     scope: "Оценивается только вторая часть: нет ли сведений, без которых проект не выполнить, только по внешней ссылке. Работают ли ссылки, судья не проверяет."}
  - {id: R40, source: rules, section: З. Язык и комплектность, by: judge, needs: [approved_files], group: package, stages: [concept, content],
     text: "Итоговый комплект соответствует утверждённому перечню материалов."}

  # ─── Паспорт: «Критерии качества проекта» ────────────────────────────────────────────────────────────────────
  - {id: P01, source: passport_project, section: Структура проекта, by: judge, group: package, stages: [content],
     text: "Название задания/проекта: название задания (репозитория) четко соответствует правилам нейминга заданий на платформе; название проекта в Readme лаконично (состоит из 1-3 слов), отражает смысловую нагрузку проекта.",
     scope: "Оценивается только название проекта в README: правил нейминга платформы у судьи нет."}
  - {id: P02, source: passport_project, section: Структура проекта, by: judge, group: package, stages: [content],
     text: "Краткая аннотация: резюме (Summary в англ. версии) содержит: о чем проект, что он включает в себя с точки зрения знаний/навыков. Идет после названия проекта."}
  - {id: P03, source: passport_project, section: Структура проекта, by: judge, group: package, stages: [content],
     text: "Содержание проекта: оглавление проекта выглядит так: Chapter 1, Chapter 2, Chapter 3 и т.д."}
  - {id: P04, source: passport_project, section: Структура проекта, by: judge, group: package, stages: [content],
     text: "Инструкция по peer-to-peer: напоминание через правила P2P, что в основе обучения лежит методология «равный равному». Для основы: это отдельный файл в репозитории. Для коммерции: как инструкция в Readme.",
     scope: "Засчитывается любой из двух вариантов — отдельный файл в проекте или инструкция в README: основа это или коммерция, судья не знает."}
  - {id: P05, source: passport_project, section: Структура проекта, by: judge, group: package, stages: [content],
     text: "Разделы (Chapter/Part): раздел (Chapter) включает: название (заголовок), отражающее смысловое содержание данного раздела; пишется с новой строки; теоретический и/или практический (в виде задач/упражнений) материал."}
  - {id: P06, source: passport_project, section: Структура проекта, by: judge, group: tasks, stages: [content],
     text: "Задачи/упражнения (Task/Exercise): задача/упражнение содержит: название, раскрывающее суть дальнейших практических действий; описание, отражающее конкретную цель; включает определенные шаги (этапы) выполнения практических действий."}
  - {id: P07, source: passport_project, section: Структура проекта, by: judge, group: package, stages: [content],
     text: "Форма для обратной связи: ссылка на анкету для предоставления ОС располагается после задач/упражнений."}

  - {id: P08, source: passport_project, section: Смысловая нагрузка материала, by: judge, group: logic, stages: [content],
     text: "Соответствие заявленной теме: представленный материал в полной мере раскрывает заявленную тему проекта."}
  - {id: P09, source: passport_project, section: Смысловая нагрузка материала, by: judge, group: logic, stages: [content],
     text: "Полнота информации: наполнение материала задач/проекта соответствует заявленным образовательным результатам; подсказки и описание проекта позволяют участнику корректно найти информацию и выполнить проект.",
     scope: "Оценивается только вторая часть: позволяют ли подсказки и описание найти информацию и выполнить проект. Утверждённых ОР у судьи нет."}
